<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Kanvis Edge</title>
  <link rel="icon" href="/static/img/kanvis_logo.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <img src="/static/img/kanvis_web.png" alt="Kanvis" class="login-logo" width="280" height="auto" />
      <p class="sub">Configuración del gateway en tienda</p>
      <form id="login-form">
        <label for="login-user">Usuario</label>
        <input id="login-user" name="username" autocomplete="username" required />
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn-block">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="app-header">
      <img src="/static/img/kanvis_logo.png" alt="" class="header-logo" width="36" height="36" />
      <div class="header-titles">
        <span class="header-title">Kanvis Edge</span>
        <span id="device-label" class="header-sub"></span>
      </div>
      <button type="button" class="btn-icon secondary" id="btn-logout" title="Cerrar sesión">Salir</button>
    </header>

    <main class="app-main">
      <section id="tab-cameras" class="tab-panel">
        <div class="cam-toolbar">
          <button type="button" class="btn-block primary" id="btn-add-device">+ Añadir cámara (IP)</button>
        </div>
        <nav id="device-nav" class="device-nav" aria-label="Cámaras por IP"></nav>
        <div id="device-panels" class="device-panels">
          <p class="empty-hint" id="cameras-empty">Pulsa «Añadir cámara» para configurar una IP.</p>
        </div>
      </section>

      <section id="tab-system" class="tab-panel hidden">
        <details class="panel" open>
          <summary>Horario (búfer + broadcast)</summary>
          <p class="hint">Fuera de estas franjas no hay ingesta ni rebroadcast.</p>
          <label class="check-row"><input type="checkbox" id="sched-enabled" /> Activar horario</label>
          <label>Zona horaria</label>
          <input id="sched-timezone" placeholder="Europe/Madrid" />
          <p id="sched-status-line" class="status-line">—</p>
          <div id="sched-windows"></div>
          <div class="actions">
            <button type="button" class="secondary" id="btn-sched-add-window">+ Franja</button>
            <button type="button" id="btn-sched-save">Guardar horario</button>
          </div>
        </details>
        <details class="panel">
          <summary>Conectividad nube</summary>
          <button type="button" id="btn-wan-sync" class="btn-block secondary">Sincronizar IP</button>
          <pre id="connectivity-info" class="log compact">—</pre>
        </details>
        <details class="panel">
          <summary>Info dispositivo</summary>
          <p><strong>Nombre:</strong> <span id="sys-device-name">—</span></p>
          <p><strong>ID:</strong> <span id="sys-device-id">—</span></p>
        </details>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Secciones">
      <button type="button" data-tab="cameras" class="active">
        <span class="nav-icon">📷</span>
        <span>Cámaras</span>
      </button>
      <button type="button" data-tab="system">
        <span class="nav-icon">⚙</span>
        <span>Sistema</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="/static/js/webrtc-viewer.js"></script>
  <script src="/static/js/app.js?v=202505-codec"></script>
</body>
</html>
